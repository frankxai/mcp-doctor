name: harness

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  mcp-gauntlet:
    name: MCP server contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: MCP gauntlet
        run: node test/mcp-gauntlet.mjs
