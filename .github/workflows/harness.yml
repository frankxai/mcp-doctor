name: harness

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  mcp-gauntlet:
    name: MCP server contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm run build
      - name: MCP gauntlet
        run: node test/mcp-gauntlet.mjs
