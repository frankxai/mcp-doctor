name: Release

# Trusted publishing (OIDC). There is no NPM_TOKEN here and there must never be one: npm revoked
# classic tokens in Dec 2025 and caps write tokens at 90 days, while OIDC issues a short-lived,
# workflow-scoped credential and attaches provenance automatically.
#
# Two things this file depends on, both configured outside it:
#   1. npmjs.com → the package → Trusted Publisher: repo + workflow filename `release.yml` + environment
#      `npm-publish`. A package must already EXIST on npm before a trusted publisher can be attached,
#      so a brand-new name gets one manual `npm publish` from the CI tarball first.
#   2. GitHub → the repo → Environments → `npm-publish` with Frank as a required reviewer. That is the
#      estate's "never merge/publish unattended" gate, enforced by the platform rather than by habit.
#
# Do NOT put `[skip ci]` in the version-PR merge commit — it suppresses the push that publishes.
# Provenance requires a PUBLIC repository. On a private repo the publish still works, unsigned.

on:
  push:
    branches: [main]
    paths:
      - .changeset/**
      - package.json
      - pnpm-lock.yaml
      - CHANGELOG.md
      - src/**
      - server.json
      - .github/workflows/release.yml

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@v2
        with:
          pr-title: "release: version packages"
          commit-message: "release: version packages"
          pr-draft: create

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present build
      - run: pnpm test
      - run: pnpm run verify -- --skip-changeset
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: publish
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
