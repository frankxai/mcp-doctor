name: CI

# Light by design: it runs on drafts because under storage BOUNDED this is the only build that
# happens at all. The estate's draft gate exists to keep *heavy* jobs off drafts, not to stop a
# 10-minute verify. The uploaded tarball is what Frank publishes by hand for a brand-new name.

on:
  pull_request:
    paths:
      - .changeset/**
      - .github/workflows/ci.yml
      - LICENSE
      - README.md
      - dist/**
      - package.json
      - pnpm-lock.yaml
      - scripts/release/**
      - server.json
      - src/**
      - test/**
      - tsconfig.json
  push:
    branches: [main]
    paths:
      - src/**
      - test/**
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present build
      - run: pnpm test
      - run: pnpm run verify
      - run: pnpm pack --pack-destination artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: artifacts/*.tgz
          retention-days: 7
