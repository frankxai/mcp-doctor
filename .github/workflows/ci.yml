name: CI

# Light by design: it runs on drafts because under storage BOUNDED this is the only build that
# happens at all. The estate's draft gate exists to keep *heavy* jobs off drafts, not to stop a
# 10-minute verify. The uploaded tarball is what Frank publishes by hand for a brand-new name.

on:
  pull_request:
    paths:
      - src/**
      - test/**
      - scripts/release/**
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - server.json
      - .changeset/**
      - .github/workflows/ci.yml
  push:
    branches: [main]
    paths:
      - src/**
      - test/**
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present build
      - run: pnpm test
      - run: pnpm run verify
      - run: pnpm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: artifacts/*.tgz
          retention-days: 7
